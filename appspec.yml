version: 0.0
os: linux

files:
  # 🔥 deploy/ 기준 전체를 그대로 복사 (구조 보존)
  - source: /
    destination: /home/ubuntu/app/miniproject4-next
    overwrite: true
  # scripts나 appspec 등 루트에 있는 파일 처리 (필요시)
  - source: /scripts
    destination: /home/ubuntu/app/scripts
    overwrite: true

permissions:
  # 🔥 부모 디렉토리까지 포함 (권한 문제 종결)
  - object: /home/ubuntu/app
    pattern: "**"
    owner: ubuntu
    group: ubuntu
    mode: 755
    type:
      - directory
      - file

hooks:
  # ApplicationStop:
  #   - location: scripts/stop.sh
  #     timeout: 60
  #     runas: ubuntu

  ApplicationStart:
    - location: scripts/start.sh
      timeout: 120
      runas: ubuntu
