version: 0.2

env:
  variables:
    APP_DIR: "miniproject4-next"

phases:
  install:
    runtime-versions:
      nodejs: 20
  build:
    commands:
      - cd $APP_DIR
      - npm ci
      - npm run build
      - echo "Build completed in $APP_DIR"
      # 여기서 cd .. 을 하지 않고 그대로 종료합니다.

artifacts:
  base-directory: 'miniproject4-next'
  files:
    - '.next/**/*'
    - 'public/**/*'
    - 'package.json'
    - 'package-lock.json'
    - 'next.config.mjs'
    - '../appspec.yml'
    - '../scripts/**/*'